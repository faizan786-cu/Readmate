name: Build APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Required Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Setup Matching Google Services & Fixed Keystore
        run: |
          # Fixed Keystore generation (consistent key for updates)
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=ReadMate,O=ReadMateApp,C=US"
            
          mkdir -p app
          cp debug.keystore app/debug.keystore

          # Inject valid google-services.json
          cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "readmate-app",
              "storage_bucket": "readmate-app.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:abcdef123456",
                  "android_client_info": {
                    "package_name": "com.aistudio.readmate.klnzvq"
                  }
                },
                "api_key": [
                  {
                    "current_key": "fake_api_key_for_build"
                  }
                ]
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Locate and Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: update-v${{ github.run_number }}
          name: ReadMate App v${{ github.run_number }}
          files: |
            app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          

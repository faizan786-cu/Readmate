name: Auto Build & Release on Push

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Restore Master Keystore and Google Services
        env:
          KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android

          if [ -n "$KEYSTORE_BASE64" ]; then
            # Windows certutil ke BEGIN/END headers remove karke pure base64 decode karna
            echo "$KEYSTORE_BASE64" | sed '/^-----/d' | tr -d '\r\n ' | base64 -d > debug.keystore
            cp debug.keystore ~/.android/debug.keystore
            echo "Master keystore restored successfully from GitHub Secrets."
          elif [ -f "debug.keystore" ]; then
            cp debug.keystore ~/.android/debug.keystore
            echo "Keystore restored from workspace file."
          else
            echo "ERROR: debug.keystore not found in repository or secrets!"
            exit 1
          fi

          # Mock google-services.json
          cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "readmate-auto",
              "storage_bucket": "readmate-auto.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:abcdef123456",
                  "android_client_info": {
                    "package_name": "com.aistudio.readmate.klnzvq"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyFakeKeyForBuildValidationPurposeOnly"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Auto-Bump Version and Build APK
        id: build_apk
        run: |
          BUILD_NUM=${{ github.run_number }}
          VERSION_NAME="1.0.${BUILD_NUM}"
          echo "Building Version: $VERSION_NAME ($BUILD_NUM)"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug -PcustomVersionCode=$BUILD_NUM -PcustomVersionName="$VERSION_NAME" --stacktrace
          else
            gradle assembleDebug -PcustomVersionCode=$BUILD_NUM -PcustomVersionName="$VERSION_NAME" --stacktrace
          fi

          echo "VERSION_TAG=v1.0.${BUILD_NUM}" >> $GITHUB_ENV
          echo "VERSION_NAME=Release v1.0.${BUILD_NUM}" >> $GITHUB_ENV

      - name: Find, Rename and Prepare Release Binaries
        id: prep_apk
        run: |
          ORIGINAL_APK=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          if [ -z "$ORIGINAL_APK" ]; then
            echo "ERROR: Compiled APK file not found!"
            exit 1
          fi
          echo "Found source APK at: $ORIGINAL_APK"

          # 1. Versioned APK: ReadMate-v1.0.XX.apk
          VERSIONED_APK="ReadMate-${{ env.VERSION_TAG }}.apk"
          cp "$ORIGINAL_APK" "./$VERSIONED_APK"

          # 2. Static Universal APK for permanent web routing: ReadMate.apk
          cp "$ORIGINAL_APK" "./ReadMate.apk"

          echo "Prepared artifacts:"
          ls -lh ReadMate*

          echo "VERSIONED_APK_PATH=./$VERSIONED_APK" >> $GITHUB_ENV
          echo "STATIC_APK_PATH=./ReadMate.apk" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.VERSIONED_APK_PATH }}
            ${{ env.STATIC_APK_PATH }}
          tag_name: ${{ env.VERSION_TAG }}
          name: ${{ env.VERSION_NAME }}
          body: |
            ### ReadMate Automated Release - ${{ env.VERSION_TAG }}
            * Universal production APK built with R8 tree-shaking and on-device Room SQLite engine.
            * Signed with repository keystore.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

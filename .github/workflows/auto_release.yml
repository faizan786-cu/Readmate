name: Auto Build & Release on Push

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Cache Permanent Signing Keystore
        id: cache-keystore
        uses: actions/cache@v4
        with:
          path: signing_vault/readmate_permanent.keystore
          key: readmate-permanent-signing-keystore-v1

      - name: Setup Deterministic Keystore and Google Services
        run: |
          mkdir -p signing_vault
          KEYSTORE_PATH="signing_vault/readmate_permanent.keystore"

          # Agar cache mein pehle se keystore mojood nahi hai to ek baar banayein
          if [ ! -f "$KEYSTORE_PATH" ]; then
            echo "Creating Master Permanent Keystore..."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -alias readmatekey \
              -keypass androidpass \
              -storepass androidpass \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=ReadMate,O=ReadMateApp,C=US"
          else
            echo "Master Permanent Keystore restored from cache!"
          fi

          # Gradle build ke path par copy karein
          cp "$KEYSTORE_PATH" debug.keystore
          mkdir -p ~/.android
          cp "$KEYSTORE_PATH" ~/.android/debug.keystore

          # Google Services config inject karein
          cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "readmate-auto",
              "storage_bucket": "readmate-auto.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:abcdef123456",
                  "android_client_info": {
                    "package_name": "com.aistudio.readmate.klnzvq"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyFakeKeyForBuildValidationPurposeOnly"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Auto-Bump Version and Build APK
        id: build_apk
        run: |
          BUILD_NUM=${{ github.run_number }}
          VERSION_NAME="1.0.${BUILD_NUM}"
          echo "Building Version: $VERSION_NAME ($BUILD_NUM)"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug -PcustomVersionCode=$BUILD_NUM -PcustomVersionName="$VERSION_NAME" --stacktrace
          else
            gradle assembleDebug -PcustomVersionCode=$BUILD_NUM -PcustomVersionName="$VERSION_NAME" --stacktrace
          fi

          echo "VERSION_TAG=v1.0.${BUILD_NUM}" >> $GITHUB_ENV
          echo "VERSION_NAME=Release v1.0.${BUILD_NUM}" >> $GITHUB_ENV

      - name: Find APK File
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK file not found!"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_PATH }}
          tag_name: ${{ env.VERSION_TAG }}
          name: ${{ env.VERSION_NAME }}
          body: "Automated build ${{ env.VERSION_TAG }} generated with persistent signature cache."
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

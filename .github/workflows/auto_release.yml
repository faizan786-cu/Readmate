name: Auto Build & Release on Push

on:
  push:
    branches:
      - main

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Keystore & Mock Google Services
        run: |
          # 1. Generate missing debug.keystore in project root
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

          # 2. Prevent crash if google-services.json is missing
          if [ ! -f "app/google-services.json" ]; then
            echo '{"project_info":{"project_number":"0","project_id":"readmate"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0","android_client_info":{"package_name":"com.readmate"}},"api_key":[{"current_key":"mock"}]}]}' > app/google-services.json
          fi

      - name: Auto-Bump Version and Build APK
        id: build_apk
        run: |
          BUILD_NUM=${{ github.run_number }}
          VERSION_NAME="1.0.${BUILD_NUM}"
          echo "Building Version: $VERSION_NAME ($BUILD_NUM)"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug -PcustomVersionCode=$BUILD_NUM -PcustomVersionName="$VERSION_NAME" --stacktrace
          else
            gradle assembleDebug -PcustomVersionCode=$BUILD_NUM -PcustomVersionName="$VERSION_NAME" --stacktrace
          fi

          echo "VERSION_TAG=v1.0.${BUILD_NUM}" >> $GITHUB_ENV
          echo "VERSION_NAME=Release v1.0.${BUILD_NUM}" >> $GITHUB_ENV

      - name: Find APK File
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK file not found!"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_PATH }}
          tag_name: ${{ env.VERSION_TAG }}
          name: ${{ env.VERSION_NAME }}
          body: "Automated build ${{ env.VERSION_TAG }} generated successfully."
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

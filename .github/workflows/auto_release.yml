name: Auto Build & Release on Push

on:
  push:
    branches:
      - main # agar aapki branch 'master' hai to yahan master likhein

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Auto-Bump Version and Build APK
        id: build_apk
        run: |
          BUILD_NUM=${{ github.run_number }}
          VERSION_NAME="1.0.${BUILD_NUM}"
          echo "Building Version: $VERSION_NAME ($BUILD_NUM)"
          
          # Agar gradlew file exist karti hai to use karein, warna direct gradle CLI se build karein
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug -PcustomVersionCode=$BUILD_NUM -PcustomVersionName="$VERSION_NAME"
          else
            gradle assembleDebug -PcustomVersionCode=$BUILD_NUM -PcustomVersionName="$VERSION_NAME"
          fi
          
          echo "VERSION_TAG=v1.0.${BUILD_NUM}" >> $GITHUB_ENV
          echo "VERSION_NAME=Release v1.0.${BUILD_NUM}" >> $GITHUB_ENV

      - name: Find APK File
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK file not found!"
            exit 1
          fi
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_PATH }}
          tag_name: ${{ env.VERSION_TAG }}
          name: ${{ env.VERSION_NAME }}
          body: "Automated update build ${{ env.VERSION_TAG }} generated successfully."
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

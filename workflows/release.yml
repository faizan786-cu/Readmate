name: Auto Build & Release on Push

on:
  push:
    branches:
      - main # ya aapki jo bhi default branch hai

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Auto-Bump Version and Build APK
        id: build_apk
        run: |
          BUILD_NUM=${{ github.run_number }}
          VERSION_NAME="1.0.${BUILD_NUM}"
          echo "Building Version: $VERSION_NAME ($BUILD_NUM)"
          
          # Gradle ko command line se dynamic version pass karna
          chmod +x ./gradlew
          ./gradlew assembleRelease -PcustomVersionCode=$BUILD_NUM -PcustomVersionName="$VERSION_NAME" || ./gradlew assembleDebug -PcustomVersionCode=$BUILD_NUM -PcustomVersionName="$VERSION_NAME"
          
          echo "VERSION_TAG=v1.0.${BUILD_NUM}" >> $GITHUB_ENV
          echo "VERSION_NAME=Release v1.0.${BUILD_NUM}" >> $GITHUB_ENV

      - name: Find APK File
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_PATH }}
          tag_name: ${{ env.VERSION_TAG }}
          name: ${{ env.VERSION_NAME }}
          body: "Automated update pushed via Google AI Studio."
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
